// FINANCEIRO
// ══════════════════════════════════════════════════════════
function renderFinanceiro() {
  var hoje = new Date(), y = hoje.getFullYear(), m = hoje.getMonth();
  var MS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var mesAtual = y + '-' + String(m+1).padStart(2,'0');

  // Retorna o mês de pagamento efetivo de um pacote pago
  function pkgPayMes(p){
    var d=p.data_pagamento||(p.updated_at?p.updated_at.slice(0,10):null)||(p.created_at?p.created_at.slice(0,10):null);
    return d?d.slice(0,7):'';
  }

  var sesMes = allSessions.filter(function(s){
    if (s.status!=='realizada' && s.status!=='parcial') return false;
    var parts = s.date.split('-').map(Number);
    return parts[0]===y && (parts[1]-1)===m;
  });
  var recMes = sesMes.reduce(function(a,s){ return a+(parseFloat(s.valor)||0); }, 0);
  // Pacotes pagos neste mês
  recMes += allPackages.filter(function(p){ return p.pago && pkgPayMes(p)===mesAtual; })
    .reduce(function(a,p){ return a+(parseFloat(p.valor_total)||0); }, 0);
  var recTotal = allSessions.filter(function(s){ return s.status==='realizada'||s.status==='parcial'; })
    .reduce(function(a,s){ return a+(parseFloat(s.valor)||0); }, 0);
  // Total recebido inclui todos os pacotes pagos
  recTotal += allPackages.filter(function(p){ return p.pago; })
    .reduce(function(a,p){ return a+(parseFloat(p.valor_total)||0); }, 0);
  var pendentes = allPackages.filter(function(p){ return !p.pago && !p.encerrado; });
  var totPend   = pendentes.reduce(function(a,p){ return a+(parseFloat(p.valor_total)||0); }, 0);

  var porMes = {};
  allSessions.filter(function(s){ return s.status==='realizada'||s.status==='parcial'; }).forEach(function(s){
    var ym = s.date.slice(0,7);
    porMes[ym] = (porMes[ym]||0) + (parseFloat(s.valor)||0);
  });
  // Pacotes pagos entram no histórico pelo mês do pagamento (com fallback para updated_at/created_at)
  allPackages.filter(function(p){ return p.pago; }).forEach(function(p){
    var ym = pkgPayMes(p);
    if(ym){ porMes[ym] = (porMes[ym]||0) + (parseFloat(p.valor_total)||0); }
  });
  var meses = Object.keys(porMes).sort().reverse();

  var porTipo = {};
  allSessions.filter(function(s){ return s.status==='realizada'; }).forEach(function(s){
    porTipo[s.tipo] = (porTipo[s.tipo]||0) + (parseFloat(s.valor)||0);
  });

  var html = '<div class="topbar"><button class="hamburger" onclick="toggleSidebar()">☰</button><h1 class="page-title">Financeiro</h1>' + themeBtn() + '</div>';
  html += '<div style="font-size:12px;font-weight:600;color:var(--text3);margin-bottom:9px">📅 Resumo de ' + MS[m] + ' de ' + y + '</div>';
  html += '<div class="grid-4" style="margin-bottom:18px">';
  html += '<div class="stat-card green"><div class="stat-icon">💵</div><div class="stat-val">' + fmtMoney(recMes) + '</div><div class="stat-label">Recebido este mês</div></div>';
  html += '<div class="stat-card yellow"><div class="stat-icon">⏳</div><div class="stat-val">' + fmtMoney(totPend) + '</div><div class="stat-label">A Receber (' + pendentes.length + ')</div></div>';
  html += '<div class="stat-card blue"><div class="stat-icon">📊</div><div class="stat-val">' + sesMes.length + '</div><div class="stat-label">Sessões este mês</div></div>';
  html += '<div class="stat-card purple"><div class="stat-icon">💰</div><div class="stat-val">' + fmtMoney(recTotal) + '</div><div class="stat-label">Total Recebido</div></div>';
  html += '</div>';

  html += '<div class="grid-2" style="margin-bottom:18px">';
  html += '<div class="card"><div class="section-title" style="margin-bottom:13px">📅 Histórico por Mês</div>';
  html += '<div class="table-wrap"><table><thead><tr><th>MÊS</th><th style="text-align:right">RECEITA</th></tr></thead><tbody>';
  if (meses.length) {
    meses.forEach(function(ym) {
      var parts = ym.split('-').map(Number);
      var cur = ym===mesAtual;
      html += '<tr' + (cur?' style="background:rgba(52,217,138,.05)"':'') + '>';
      html += '<td>' + (cur?'🟢 ':'') + '<b>' + MS[parts[1]-1] + ' de ' + parts[0] + (cur?' (atual)':'') + '</b></td>';
      html += '<td style="text-align:right;color:var(--green);font-weight:600">' + fmtMoney(porMes[ym]) + '</td></tr>';
    });
  } else {
    html += '<tr><td colspan="2" style="text-align:center;color:var(--text3);padding:16px">💡 Sessões realizadas com valor aparecem aqui</td></tr>';
  }
  html += '</tbody></table></div></div>';

  html += '<div class="card"><div class="section-title" style="margin-bottom:13px">Por tipo de serviço</div>';
  var tipoEntries = Object.keys(porTipo);
  if (tipoEntries.length) {
    tipoEntries.forEach(function(t) {
      var cor = t==='psicoterapia'?'var(--blue)':t==='tarot'?'var(--green)':t==='reiki'?'var(--purple)':t==='astrologia'?'var(--yellow)':'var(--orange)';
      html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">';
      html += '<div style="width:3px;height:28px;border-radius:9px;background:' + cor + ';flex-shrink:0"></div>';
      html += '<div style="flex:1">' + (TIPOS[t]?TIPOS[t].emoji+' '+TIPOS[t].label:t) + '</div>';
      html += '<div style="font-weight:600">' + fmtMoney(porTipo[t]) + '</div></div>';
    });
  } else {
    html += '<div class="empty" style="padding:16px">Sem dados ainda</div>';
  }
  html += '</div></div>';

  html += '<div class="card"><div class="section-title" style="margin-bottom:13px">⏳ Pagamentos Pendentes</div>';
  if (pendentes.length) {
    html += '<div class="table-wrap"><table><thead><tr><th>CLIENTE</th><th>TIPO</th><th>VALOR</th><th>STATUS</th><th>AÇÃO</th></tr></thead><tbody>';
    pendentes.forEach(function(p) {
      html += '<tr><td><b>' + clientName(p.client_id) + '</b></td>';
      html += '<td>' + (TIPOS[p.tipo]?TIPOS[p.tipo].label:p.tipo) + '</td>';
      html += '<td style="color:var(--yellow);font-weight:600">' + fmtMoney(p.valor_total) + '</td>';
      html += '<td><span class="badge badge-yellow">⏳ Pendente</span></td>';
      html += '<td><button class="btn btn-primary btn-sm" onclick="markPago(\'' + p.id + '\')">Marcar pago</button></td></tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div class="empty" style="padding:16px"><div class="empty-icon">✅</div><p>Nenhum pagamento pendente!</p></div>';
  }
  // Paid packages this month
  var pagos = allPackages.filter(function(p){ return p.pago && !p.encerrado; });
  if (pagos.length) {
    html += '<div class="card" style="margin-top:16px"><div class="section-title" style="margin-bottom:13px">✅ Pacotes Pagos</div>';
    html += '<div class="table-wrap"><table><thead><tr><th>CLIENTE</th><th>TIPO</th><th>VALOR</th><th>STATUS</th><th>AÇÃO</th></tr></thead><tbody>';
    pagos.forEach(function(p) {
      html += '<tr><td><b>' + clientName(p.client_id) + '</b></td>';
      html += '<td>' + (TIPOS[p.tipo]?TIPOS[p.tipo].label:p.tipo) + '</td>';
      html += '<td style="color:var(--green);font-weight:600">' + fmtMoney(p.valor_total) + '</td>';
      html += '<td><span class="badge badge-green" style="cursor:pointer" data-pid="' + p.id + '" onclick="markPendente(this.dataset.pid)">💰 Pago — clique para pendente</span></td>';
      html += '<td><button class="btn btn-ghost btn-sm" data-pid="' + p.id + '" onclick="markPendente(this.dataset.pid)">↩️ Desfazer</button></td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  html += '</div>';
  setMain(html);
}

async function markPendente(pid) {
  await sb.from('packages').update({ pago: false, data_pagamento: null }).eq('id', pid);
  await loadAll(); renderFinanceiro(); showToast('⏳ Marcado como pendente!');
}

async function markPago(pid) {
  var hoje = new Date().toISOString().slice(0,10);
  await sb.from('packages').update({ pago: true, data_pagamento: hoje }).eq('id', pid);
  await loadAll(); renderFinanceiro(); showToast('💰 Pagamento registrado!');
}

  var html = '<div class="topbar"><button class="hamburger" onclick="toggleSidebar()">☰</button><h1 class="page-title">Backup 💾</h1>' + themeBtn() + '</div>';
  html += '<div class="grid-2">';

  html += '<div class="card">';

  html += '<p style="color:var(--text2);font-size:13px;margin-bottom:16px">Baixa um arquivo JSON com todos os seus dados: clientes, pacotes, sessões e notas.</p>';
  html += '<button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doExport()">⬇️ Baixar Backup (JSON)</button>';
  html += '<div style="margin-top:10px;font-size:11px;color:var(--text3)">💡 Recomendado fazer backup toda semana</div>';
  html += '</div>';

  // Import card

  html += '<div class="grid-4">';
  html += '<div class="stat-card"><div class="stat-icon">👥</div><div class="stat-val">' + allClients.length + '</div><div class="stat-label">Clientes</div></div>';

async function doExport() {
  showToast('⏳ Gerando backup...', 'ok', 3000);
  try {
    var uid = currentUser.id;
    var results = await Promise.all([
      sb.from('clients').select('*').eq('user_id', uid),
      sb.from('packages').select('*').eq('user_id', uid),
      sb.from('sessions').select('*').eq('user_id', uid),
      sb.from('notes').select('*').eq('user_id', uid),
    ]);
    var backup = {
      version: '1.0',
      app: 'Lua Selva',
      date: new Date().toISOString(),
      user: currentUser.email,
      data: {
        clients:  results[0].data || [],
        packages: results[1].data || [],
        sessions: results[2].data || [],
        notes:    results[3].data || []
      }
    };
    var json    = JSON.stringify(backup, null, 2);
    var blob    = new Blob([json], { type: 'application/json' });
    var url     = URL.createObjectURL(blob);
    var a       = document.createElement('a');
    var dateStr = new Date().toISOString().slice(0,10);
    a.href      = url;
    a.download  = 'luaselva-backup-' + dateStr + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ Backup baixado com sucesso!');
  } catch(e) {
    showToast('❌ Erro ao gerar backup: ' + e.message, 'er');
  }
}

function previewRestore(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.data || !data.app) { showToast('❌ Arquivo inválido', 'er'); return; }
      var preview = document.getElementById('bk-preview');
      preview.innerHTML =
        '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px">' +
        '<div style="font-size:13px;font-weight:600;margin-bottom:6px">📋 Arquivo: ' + file.name + '</div>' +
        '<div style="font-size:12px;color:var(--text2)">Data do backup: ' + (data.date?new Date(data.date).toLocaleDateString('pt-BR'):'?') + '</div>' +
        '<div style="font-size:12px;color:var(--text2)">Conteúdo: ' +
          (data.data.clients||[]).length + ' clientes · ' +
          (data.data.packages||[]).length + ' pacotes · ' +
          (data.data.sessions||[]).length + ' sessões · ' +
          (data.data.notes||[]).length + ' notas</div>' +
        '</div>' +
        '<div class="alert alert-yellow">⚠️ A restauração vai SUBSTITUIR todos os dados atuais!</div>' +
        '<button class="btn btn-danger" style="width:100%;justify-content:center" onclick="doRestore()">🔄 Restaurar Agora</button>';
      preview.dataset.backup = e.target.result;
    } catch(err) {
      showToast('❌ Arquivo JSON inválido', 'er');
    }
  };
  reader.readAsText(file);
}

async function doRestore() {
  if (!confirm('Tem certeza? Todos os dados atuais serão substituídos pelo backup!')) return;
  var preview = document.getElementById('bk-preview');
  if (!preview || !preview.dataset.backup) return;
  try {
    var backup = JSON.parse(preview.dataset.backup);
    var d = backup.data;
    var uid = currentUser.id;
    showToast('⏳ Restaurando...', 'ok', 10000);

    // Delete existing data
    await sb.from('sessions').delete().eq('user_id', uid);
    await sb.from('packages').delete().eq('user_id', uid);
    await sb.from('clients').delete().eq('user_id', uid);
    await sb.from('notes').delete().eq('user_id', uid);

    // Re-insert with current user_id
    var fix = function(arr) {
      return (arr||[]).map(function(r) {
        var obj = Object.assign({}, r);
        obj.user_id = uid;
        return obj;
      });
    };

    if (d.clients  && d.clients.length)  await sb.from('clients').insert(fix(d.clients));
    if (d.packages && d.packages.length) await sb.from('packages').insert(fix(d.packages));
    if (d.sessions && d.sessions.length) await sb.from('sessions').insert(fix(d.sessions));
    if (d.notes    && d.notes.length)    await sb.from('notes').insert(fix(d.notes));

    await loadAll();
    showToast('✅ Backup restaurado com sucesso!');
    go('dashboard');
  } catch(e) {
    showToast('❌ Erro ao restaurar: ' + e.message, 'er');
  }
}

async function changePass() {
  var p = document.getElementById('cfg-pass').value;
  if (!p || p.length < 6) { alert('Mínimo 6 caracteres'); return; }
  var res = await sb.auth.updateUser({ password: p });
  if (res.error) alert('Erro: ' + res.error.message);
  else alert('Senha alterada!');
}
