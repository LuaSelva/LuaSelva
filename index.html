<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Selva</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lua Selva">
<meta name="theme-color" content="#0f1117">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--text:#e8eaf0;--text2:#9099b0;--text3:#5a6278;--green:#34d98a;--red:#f06060;--yellow:#f5c842;--blue:#60a5fa;--purple:#a78bfa;--orange:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}
/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:44px 38px;width:100%;max-width:400px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo img{width:68px;height:68px;object-fit:cover;border-radius:16px;margin-bottom:12px}
.login-logo h1{font-size:22px;font-weight:700}
.login-logo p{color:var(--text2);font-size:13px;margin-top:3px}
/* APP */
#app{display:flex;min-height:100vh}
.sidebar{width:228px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sidebar-logo{padding:16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo img{width:34px;height:34px;object-fit:cover;border-radius:8px;flex-shrink:0}
.sidebar-logo-text h2{font-size:14px;font-weight:700}
.sidebar-logo-text p{font-size:10px;color:var(--text3);margin-top:1px}
.nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:rgba(52,217,138,.18);color:var(--green)}
.nav-btn .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 8px;border-top:1px solid var(--border)}
.main{margin-left:228px;flex:1;min-height:100vh;padding:24px 28px}
/* TOPBAR */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.page-title{font-size:20px;font-weight:700;flex:1;letter-spacing:-.03em}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat-card.green{border-color:rgba(52,217,138,.2);background:linear-gradient(135deg,var(--bg2) 60%,rgba(52,217,138,.04))}
.stat-card.blue{border-color:rgba(96,165,250,.2)}
.stat-card.yellow{border-color:rgba(245,200,66,.2)}
.stat-card.purple{border-color:rgba(167,139,250,.2)}
.stat-icon{font-size:20px;margin-bottom:7px}
.stat-val{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.04em}
.stat-label{font-size:10px;color:var(--text2);margin-top:4px;letter-spacing:.05em;font-weight:500;text-transform:uppercase}
/* TABLES */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:9px 13px;border-bottom:1px solid var(--border)}
td{padding:10px 13px;font-size:13px;border-bottom:1px solid var(--border);line-height:1.4}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.td-muted{color:var(--text2)}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:rgba(52,217,138,.12);color:var(--green);border:1px solid rgba(52,217,138,.25)}
.badge-red{background:rgba(240,96,96,.12);color:var(--red);border:1px solid rgba(240,96,96,.25)}
.badge-yellow{background:rgba(245,200,66,.12);color:var(--yellow);border:1px solid rgba(245,200,66,.25)}
.badge-blue{background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
.badge-purple{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.badge-orange{background:rgba(251,146,60,.12);color:var(--orange);border:1px solid rgba(251,146,60,.25)}
.badge-gray{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--green);color:#0a1a12}.btn-primary:hover{background:#3ee99a}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:#252b3b}
.btn-danger{background:rgba(240,96,96,.12);color:var(--red);border:1px solid rgba(240,96,96,.25)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
/* FORMS */
.form-group{margin-bottom:13px}
label{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(52,217,138,.1)}
textarea{resize:vertical;min-height:75px}
select option{background:var(--bg3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:13px;border-top:1px solid var(--border)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:slideUp .2s}
.modal-box.lg{max-width:720px}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:2px 6px;border-radius:6px;line-height:1}
.modal-close:hover{background:var(--bg3)}
.modal-body{padding:20px}
/* MISC */
.progress-bar{height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:99px;transition:width .4s}
.pg-green{background:var(--green)}.pg-yellow{background:var(--yellow)}.pg-red{background:var(--red)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:14px;font-weight:600}
.avatar{border-radius:12px;background:linear-gradient(135deg,rgba(167,139,250,.3),rgba(52,217,138,.2));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--green);flex-shrink:0}
.alert{padding:9px 13px;border-radius:9px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.alert-red{background:rgba(240,96,96,.12);color:var(--red);border:1px solid rgba(240,96,96,.25)}
.alert-yellow{background:rgba(245,200,66,.12);color:var(--yellow);border:1px solid rgba(245,200,66,.25)}
.empty{text-align:center;padding:36px 20px;color:var(--text2)}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.4}
.search-wrap{position:relative}
.search-wrap input{padding-left:32px;border:none;background:transparent;box-shadow:none}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.done-toggle{background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;padding:5px 0;font-family:inherit;text-align:left;display:block;margin-top:6px}
.done-toggle:hover{color:var(--text2)}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
.overlay.open{display:block}
/* CALENDAR */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.cal-nav-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:14px}
.cal-title{font-size:17px;font-weight:700}
.cal-view-btns{display:flex;gap:3px;background:var(--bg3);border-radius:9px;padding:3px}
.cal-view-btn{padding:4px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:inherit}
.cal-view-btn.active{background:var(--bg2);color:var(--text)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.month-header{text-align:center;padding:9px 3px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;border-bottom:1px solid var(--border)}
.month-day{min-height:90px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer}
.month-day:nth-child(7n){border-right:none}
.month-day:hover{background:rgba(255,255,255,.015)}
.month-day.other{opacity:.3}
.month-day.today{background:rgba(52,217,138,.05)}
.day-num{font-size:12px;font-weight:600;color:var(--text2);width:23px;height:23px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:3px}
.today .day-num{background:var(--green);color:#0a1a12;font-weight:700}
.cal-chip{border-radius:4px;padding:2px 5px;font-size:10px;font-weight:500;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.3}
.chip-ps{background:rgba(96,165,250,.2);color:#93c5fd;border-left:2px solid var(--blue)}
.chip-ta{background:rgba(52,217,138,.18);color:#6ee7b7;border-left:2px solid var(--green)}
.chip-re{background:rgba(167,139,250,.2);color:#c4b5fd;border-left:2px solid var(--purple)}
.chip-ba{background:rgba(251,146,60,.18);color:#fdba74;border-left:2px solid var(--orange)}
.chip-as{background:rgba(245,200,66,.18);color:#fde68a;border-left:2px solid var(--yellow)}
.chip-fa{background:rgba(240,96,96,.18);color:#fca5a5;border-left:2px solid var(--red);text-decoration:line-through}
.chip-done{opacity:.55}
.toast{position:fixed;bottom:22px;right:22px;background:var(--bg2);border:1px solid var(--border2);border-radius:9px;padding:10px 15px;font-size:13px;z-index:999;animation:slideUp .2s}
.toast.ok{border-color:rgba(52,217,138,.4);color:var(--green)}
.toast.er{border-color:rgba(240,96,96,.4);color:var(--red)}
.note-card{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:9px}
.note-saving{border-color:rgba(245,200,66,.4)}
.note-saved{border-color:rgba(52,217,138,.4)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:14px}.grid-4{grid-template-columns:1fr 1fr}
  .grid-2,.form-row{grid-template-columns:1fr}.hamburger{display:block}
  .month-day{min-height:60px}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

function tipoOpts(sel) {
  var html = '';

function badgeTipo(tipo) {
  var t = TIPOS[tipo] || { label: tipo, emoji: '', badge: 'badge-gray' };

  var map = {
    agendada:  { cls: 'badge-blue',   txt: '📅 Agendada' },
    realizada: { cls: 'badge-green',  txt: '✅ Realizada' },
    falta:     { cls: 'badge-red',    txt: '❌ Falta' },
    parcial:   { cls: 'badge-orange', txt: '⚠️ Parcial' }
  };
  var x = map[s] || { cls: 'badge-gray', txt: s || '—' };

// UTILS
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR');
}
function fmtMoney(v) {
  return 'R$ ' + (parseFloat(v) || 0).toFixed(2).replace('.', ',');
}
function fmtSize(b) {
  if (b > 1048576) return (b/1048576).toFixed(1) + 'MB';
  if (b > 1024) return (b/1024).toFixed(1) + 'KB';
  return b + 'B';
}
function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(function(x){ return x[0]; }).slice(0, 2).join('').toUpperCase();
}
function clientName(id) {
  var c = allClients.find(function(x){ return x.id === id; });

}
function pluralSessao(n) {

function fileIcon(name) {

function setMain(html) { document.getElementById('main-content').innerHTML = html; }

function openModal(title, html, large) {
  document.getElementById('modal-title').textContent = title;

  var box = document.getElementById('modal-box');
  box.className = 'modal-box' + (large ? ' lg' : '');
  document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

function showToast(msg, type, ms) {
  var el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, ms || 3000);
}

// THEME
(function(){
  if (localStorage.getItem('ls_theme') === 'light') document.body.style.filter = 'none';
})();

function themeBtn() {
  return '<button class="btn btn-ghost btn-sm" onclick="toggleTheme()" style="padding:6px 10px">🔅</button>';
}
function toggleTheme() {
  showToast('Tema em desenvolvimento', 'ok', 1500);
}

// AUTH
async function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var pass  = document.getElementById('login-pass').value;
  document.getElementById('login-error').style.display = 'none';
  var result = await sb.auth.signInWithPassword({ email: email, password: pass });
  if (result.error) {
    document.getElementById('login-error').style.display = 'flex';
    return;
  }
  currentUser = result.data.user;
  startApp();
}

async function sendReset() {
  var email = document.getElementById('login-email').value.trim();
  if (!email) { alert('Digite seu e-mail.'); return; }
  await sb.auth.resetPasswordForEmail(email);
  alert('E-mail de redefinição enviado!');
}

async function doLogout() {
  await sb.auth.signOut();
  location.reload();
}

async function checkSession() {
  // Safety timeout - show login if nothing happens in 5s
  var timeout = setTimeout(function() {
    document.getElementById('login-screen').style.display = 'flex';
  }, 5000);
  try {
    var result = await sb.auth.getSession();
    clearTimeout(timeout);
    var session = result.data.session;
    if (session) {
      currentUser = session.user;
      startApp();
    } else {
      document.getElementById('login-screen').style.display = 'flex';
    }
  } catch(e) {
    clearTimeout(timeout);
    console.error('Auth error:', e);
    document.getElementById('login-screen').style.display = 'flex';
  }
}

function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  var lbl = document.getElementById('user-email');
  if (lbl) lbl.textContent = currentUser.email || '';
  loadAll().then(function(){ go('dashboard'); });
}

async function loadAll() {
  var uid = currentUser.id;
  try {
    var results = await Promise.all([
      sb.from('clients').select('*').eq('user_id', uid).order('name'),
      sb.from('packages').select('*').eq('user_id', uid).order('created_at', { ascending: false }),
      sb.from('sessions').select('*').eq('user_id', uid).order('date')
    ]);
    allClients  = results[0].data || [];
    allPackages = results[1].data || [];
    allSessions = results[2].data || [];
  } catch(e) { console.error('loadAll:', e); }
  try {
    var dr = await sb.from('documents').select('*').eq('user_id', uid).order('created_at', { ascending: false });
    allDocs = dr.data || [];
  } catch(e) { allDocs = []; }
}

// NAV
function go(page) {
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.page === page);
  });
  closeSidebar();
  var pages = {
    dashboard: renderDashboard,
    clientes:  renderClientes,
    sessoes:   renderSessoes,
    agenda:    renderAgenda,
    anexos:    renderAnexos,
    notas:     renderNotas,
    financeiro:renderFinanceiro,
    backup:    renderBackup,
    config:    renderConfig
  };
  var fn = pages[page] || renderDashboard;
  fn();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// DASHBOARD
// ══════════════════════════════════════════════════════════
function renderDashboard() {
  var hoje = new Date().toISOString().slice(0, 10);
  var em7  = new Date(); em7.setDate(em7.getDate() + 7);
  var em7s = em7.toISOString().slice(0, 10);
  var realizadas = allSessions.filter(function(s){ return s.status === 'realizada'; }).length;
  var ativos = allClients.filter(function(c){ return c.active !== false; }).length;
  var receita = allSessions.filter(function(s){ return s.status==='realizada'||s.status==='parcial'; })
    .reduce(function(a,s){ return a + (parseFloat(s.valor)||0); }, 0);
  receita += allPackages.filter(function(p){ return p.pago; })
    .reduce(function(a,p){ return a+(parseFloat(p.valor_total)||0); }, 0);
  var proximas = allSessions.filter(function(s){ return s.date>=hoje && s.date<=em7s && s.status==='agendada'; })
    .sort(function(a,b){ return a.date.localeCompare(b.date) || (a.hora||'').localeCompare(b.hora||''); });
  var pendentes = allPackages.filter(function(p){ return !p.pago && !p.encerrado; });
  var totPend = pendentes.reduce(function(a,p){ return a+(parseFloat(p.valor_total)||0); }, 0);
  var pkgsEnc = allPackages.filter(function(p){
    if (p.encerrado) return false;
    var t = parseInt(p.total_sessoes)||0;
    var r = allSessions.filter(function(s){ return s.package_id===p.id && s.status==='realizada'; }).length;
    return t>0 && (t-r)<=2;
  });

  var proxRows = proximas.slice(0, 7).map(function(s) {
    var pkg = s.package_id ? allPackages.find(function(p){ return p.id===s.package_id; }) : null;
    var n = null, tot = 0;
    if (pkg) {
      var sorted = allSessions.filter(function(x){ return x.package_id===pkg.id; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
      n = sorted.findIndex(function(x){ return x.id===s.id; }) + 1;
      tot = parseInt(pkg.total_sessoes)||0;
    }
    var dt = new Date(s.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    var t = TIPOS[s.tipo] || { label: s.tipo, chip: 'chip-ps' };
    var barColor = s.tipo==='psicoterapia'?'var(--blue)':s.tipo==='tarot'?'var(--green)':s.tipo==='reiki'?'var(--purple)':s.tipo==='astrologia'?'var(--yellow)':'var(--orange)';
    var html = '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openSessaoModal(\'' + s.id + '\')">';
    html += '<div style="width:3px;height:30px;border-radius:9px;background:'+barColor+';flex-shrink:0"></div>';
    html += '<div style="flex:1"><div style="font-size:13px;font-weight:500">' + clientName(s.client_id) + '</div>';
    html += '<div style="font-size:11px;color:var(--text2)">' + dt + (s.hora?' às '+s.hora:'') + ' · ' + t.label + (n&&tot?' · '+n+'/'+tot:'') + '</div></div></div>';
    return html;
  }).join('');

  var encRows = pkgsEnc.slice(0, 6).map(function(p) {
    var r = allSessions.filter(function(s){ return s.package_id===p.id && s.status==='realizada'; }).length;
    var t = parseInt(p.total_sessoes)||0;
    return '<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:8px">' +
      '<div style="flex:1"><div style="font-size:13px;font-weight:500">' + clientName(p.client_id) + '</div>' +
      '<div style="font-size:11px;color:var(--red)">' + (t-r) + ' sessão(ões) restante(s)</div></div>' +
      '<button class="btn btn-ghost btn-sm" onclick="openPacoteModal(\'' + p.id + '\')">Ver →</button></div>';
  }).join('');

  var html = '';
  html += '<div class="topbar"><button class="hamburger" onclick="toggleSidebar()">☰</button><h1 class="page-title">Dashboard 🌙</h1>' + themeBtn() + '<button class="btn btn-primary" onclick="go(\'agenda\')">+ Sessão</button></div>';
  html += '<div class="grid-4">';
  html += '<div class="stat-card green"><div class="stat-icon">👥</div><div class="stat-val">' + ativos + '</div><div class="stat-label">Clientes</div></div>';
  html += '<div class="stat-card blue"><div class="stat-icon">✅</div><div class="stat-val">' + realizadas + '</div><div class="stat-label">Realizadas</div></div>';
  html += '<div class="stat-card yellow"><div class="stat-icon">📁</div><div class="stat-val">' + allDocs.length + '</div><div class="stat-label">Anexos</div></div>';
  html += '<div class="stat-card purple"><div class="stat-icon">💰</div><div class="stat-val">' + fmtMoney(receita) + '</div><div class="stat-label">Receita Total</div></div>';
  html += '</div>';
  if (totPend > 0) html += '<div class="alert alert-yellow">⚠️ ' + fmtMoney(totPend) + ' em pagamentos pendentes</div>';
  html += '<div class="grid-2">';
  html += '<div class="card"><div class="section-header"><span class="section-title">📅 Próximas 7 dias</span><button class="btn btn-ghost btn-sm" onclick="go(\'agenda\')">Ver agenda →</button></div>';
  html += proxRows || '<div class="empty"><div class="empty-icon">🌙</div><p>Sem sessões nos próximos 7 dias</p></div>';
  html += '</div>';
  html += '<div class="card"><div class="section-header"><span class="section-title">⚠️ Pacotes a Encerrar</span><button class="btn btn-ghost btn-sm" onclick="go(\'sessoes\')">Ver →</button></div>';
  html += encRows || '<div class="empty" style="padding:16px"><div class="empty-icon">📦</div><p>Todos ok! 🎉</p></div>';
  html += '</div></div>';
  setMain(html);
}

// CLIENTES
// ══════════════════════════════════════════════════════════
function renderClientes() {
  var html = '<div class="topbar"><button class="hamburger" onclick="toggleSidebar()">☰</button><h1 class="page-title">Clientes</h1>' + themeBtn() + '<button class="btn btn-primary" onclick="openClienteModal()">+ Novo Cliente</button></div>';
  html += '<div class="card" style="padding:0">';
  html += '<div style="padding:11px 14px;border-bottom:1px solid var(--border)">';
  html += '<div class="search-wrap"><span class="search-icon">🔍</span><input id="search-cl" placeholder="Buscar cliente..." oninput="filterClientes()"></div>';
  html += '</div><div id="lista-clientes">' + buildClientesTable(allClients) + '</div></div>';
  setMain(html);
}

function filterClientes() {
  var q = (document.getElementById('search-cl').value || '').toLowerCase();
  var filtered = allClients.filter(function(c){
    return c.name.toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.email||'').toLowerCase().includes(q);
  });
  document.getElementById('lista-clientes').innerHTML = buildClientesTable(filtered);
}

function buildClientesTable(list) {
  if (!list.length) return '<div class="empty"><div class="empty-icon">👥</div><p>Nenhuma cliente</p></div>';
  var html = '<div class="table-wrap"><table><thead><tr><th>CLIENTE</th><th>TELEFONE</th><th>PACOTES</th><th>SESSÕES</th><th>AÇÕES</th></tr></thead><tbody>';
  list.forEach(function(c) {
    var np = allPackages.filter(function(p){ return p.client_id===c.id; }).length;
    var nr = allSessions.filter(function(s){ return s.client_id===c.id && s.status==='realizada'; }).length;
    html += '<tr>';
    html += '<td><div style="display:flex;align-items:center;gap:9px"><div class="avatar" style="width:34px;height:34px;font-size:12px">' + initials(c.name) + '</div><strong>' + c.name + '</strong></div></td>';
    html += '<td class="td-muted">' + (c.phone||'—') + '</td>';
    html += '<td><span class="badge badge-blue">' + (np===1?'1 pacote':np+' pacotes') + '</span></td>';
    html += '<td><span class="badge badge-green">' + (nr===1?'1 realizada':nr+' realizadas') + '</span></td>';
    html += '<td style="white-space:nowrap">';
    html += '<button class="btn btn-ghost btn-sm" onclick="openPerfil(\'' + c.id + '\')" title="Ver perfil">👁️</button> ';
    html += '<button class="btn btn-ghost btn-sm" onclick="openProntuario(\'' + c.id + '\')" title="Prontuário">📋</button> ';
    html += '<button class="btn btn-ghost btn-sm" onclick="openClienteModal(\'' + c.id + '\')" title="Editar">✏️</button> ';
    html += '<button class="btn btn-danger btn-sm" onclick="deleteCliente(\'' + c.id + '\')" title="Excluir">🗑️</button>';
    html += '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function openClienteModal(id) {
  var c = id ? (allClients.find(function(x){ return x.id===id; }) || {}) : {};
  var html = '';
  html += '<div class="form-group"><label>Nome *</label><input id="c-name" value="' + (c.name||'') + '"></div>';
  html += '<div class="form-row"><div class="form-group"><label>Telefone</label><input id="c-phone" value="' + (c.phone||'') + '"></div><div class="form-group"><label>Email</label><input id="c-email" type="email" value="' + (c.email||'') + '"></div></div>';
  html += '<div class="form-row"><div class="form-group"><label>Aniversário</label><input id="c-birth" type="date" value="' + (c.birthdate||'') + '"></div><div class="form-group"><label>CPF</label><input id="c-cpf" value="' + (c.cpf||'') + '"></div></div>';
  html += '<div class="form-group"><label>Observações</label><textarea id="c-obs">' + (c.observacoes||'') + '</textarea></div>';
  html += '<div class="form-actions">';
  if (id) html += '<button class="btn btn-danger" onclick="deleteCliente(\'' + id + '\')">Excluir</button>';
  html += '<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>';
  html += '<button class="btn btn-primary" onclick="saveCliente(\'' + (id||'') + '\')">Salvar</button>';
  html += '</div>';
  openModal(id ? 'Editar Cliente' : 'Nova Cliente', html);
}

async function saveCliente(id) {
  var data = {
    name: document.getElementById('c-name').value.trim(),
    phone: document.getElementById('c-phone').value.trim(),
    email: document.getElementById('c-email').value.trim(),
    birthdate: document.getElementById('c-birth').value || null,
    cpf: document.getElementById('c-cpf').value.trim(),
    observacoes: document.getElementById('c-obs').value.trim(),
    user_id: currentUser.id
  };
  if (!data.name) { alert('Nome é obrigatório'); return; }
  if (id) { await sb.from('clients').update(data).eq('id', id); }
  else { await sb.from('clients').insert(data); }
  await loadAll(); closeModal(); renderClientes(); showToast('✅ Cliente salvo!');
}

async function deleteCliente(id) {
  if (!confirm('Excluir cliente?')) return;
  await sb.from('clients').delete().eq('id', id);
  await loadAll(); closeModal(); renderClientes(); showToast('🗑️ Excluído');
}

// ══════════════════════════════════════════════════════════
// PERFIL + PRONTUÁRIO
// ══════════════════════════════════════════════════════════
function openPerfil(cid) {
  var c   = allClients.find(function(x){ return x.id===cid; }) || {};
  var pkgs = allPackages.filter(function(p){ return p.client_id===cid; });
  var ses  = allSessions.filter(function(s){ return s.client_id===cid; }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  var nr   = ses.filter(function(s){ return s.status==='realizada'; }).length;
  var nf   = ses.filter(function(s){ return s.status==='falta'; }).length;

  var html = '';
  html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">';
  html += '<div class="avatar" style="width:50px;height:50px;font-size:18px">' + initials(c.name) + '</div>';
  html += '<div><div style="font-size:17px;font-weight:700">' + c.name + '</div>';
  html += '<div style="font-size:12px;color:var(--text2)">' + ses.length + ' sessões · ' + nr + ' realizadas' + (nf?' · '+nf+' falta(s)':'') + '</div></div></div>';
  html += '<div style="display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap">';
  html += '<button class="btn btn-primary btn-sm" onclick="closeModal();openSessaoModal(null,null,\'' + cid + '\')">+ Registrar Sessão</button>';
  html += '<button class="btn btn-secondary btn-sm" onclick="closeModal();openPacoteModal(null,\'' + cid + '\')">+ Novo Pacote</button>';
  html += '<button class="btn btn-ghost btn-sm" onclick="closeModal();openClienteModal(\'' + cid + '\')">✏️ Editar</button>';
  html += '</div>';

  if (pkgs.length) {
    html += '<div style="font-size:13px;font-weight:700;margin-bottom:9px">📦 Pacotes</div>';
    pkgs.forEach(function(p) {
      var r   = allSessions.filter(function(s){ return s.package_id===p.id && s.status==='realizada'; }).length;
      var t   = parseInt(p.total_sessoes)||0;
      var pct = t>0?Math.round((r/t)*100):0;
      var bc  = pct>=100?'pg-red':pct>=70?'pg-yellow':'pg-green';
      var pg  = !!p.pago;
      html += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:8px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">';
      html += '<div style="font-weight:600">' + c.name + '</div>';
      html += '<span class="badge ' + (pg?'badge-green':'badge-yellow') + '" style="cursor:pointer" onclick="togglePago(\'' + p.id + '\',\'' + cid + '\',\'perfil\')">' + (pg?'💰 Pago':'⏳ Pendente') + '</span>';
      html += '</div>';
      html += '<div style="font-size:12px;color:var(--text2);margin-bottom:5px">Total: <b>' + t + '</b> · Realizadas: <b>' + r + '</b> · Restantes: <b>' + (t-r) + '</b> · Valor: <b>' + fmtMoney(p.valor_total) + '</b></div>';
      html += '<div class="progress-bar"><div class="progress-fill ' + bc + '" style="width:' + Math.min(pct,100) + '%"></div></div>';
      html += '</div>';
    });
  }

  html += '<div style="font-size:13px;font-weight:700;margin:13px 0 9px">📅 Histórico</div>';
  if (ses.length) {
    html += '<div class="table-wrap"><table><thead><tr><th>DATA</th><th>HORA</th><th>CATEGORIA</th><th>STATUS</th><th></th></tr></thead><tbody>';
    ses.forEach(function(s) {
      html += '<tr><td>' + fmtDate(s.date) + '</td><td>' + (s.hora||'—') + '</td><td>' + badgeTipo(s.tipo) + '</td><td>' + badgeStatus(s.status) + '</td>';
      html += '<td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="closeModal();openSessaoModal(\'' + s.id + '\')">✏️</button> ';
      html += '<button class="btn btn-danger btn-sm" onclick="closeModal();deleteSessao(\'' + s.id + '\')">🗑️</button></td></tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div class="empty" style="padding:16px"><div class="empty-icon">📅</div><p>Nenhuma sessão ainda</p></div>';
  }
  openModal('Cliente: ' + c.name, html, true);
}

function openProntuario(cid) {
  var c    = allClients.find(function(x){ return x.id===cid; }) || {};
  var pkgs = allPackages.filter(function(p){ return p.client_id===cid; });
  if (!pkgs.length) {
    openModal('📋 Prontuário — ' + c.name,
      '<div class="empty"><div class="empty-icon">📦</div><p>Nenhum pacote cadastrado.</p>' +
      '<button class="btn btn-primary" style="margin-top:11px" onclick="closeModal();openPacoteModal(null,\'' + cid + '\')">+ Criar Pacote</button></div>');
    return;
  }
  var html = '';
  pkgs.forEach(function(p) {
    var ses = allSessions.filter(function(s){ return s.package_id===p.id; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
    var r   = ses.filter(function(s){ return s.status==='realizada'; }).length;
    var t   = parseInt(p.total_sessoes)||0;
    var pg  = !!p.pago;
    var di  = p.data_inicio ? fmtDate(p.data_inicio) : (ses.length ? fmtDate(ses[0].date) : '?');
    var df  = ses.length ? fmtDate(ses[ses.length-1].date) : '?';
    html += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:15px;margin-bottom:13px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">';
    html += '<strong>' + c.name + ' (' + di + ' – ' + df + ')</strong>';
    html += '<span class="badge ' + (pg?'badge-green':'badge-yellow') + '" style="cursor:pointer" onclick="togglePago(\'' + p.id + '\',\'' + cid + '\',\'pron\')">' + (pg?'💰 Pago':'⏳ Pendente') + '</span>';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--text2);margin-bottom:9px">' + r + '/' + t + ' sessões · ' + fmtMoney(p.valor_total) + '</div>';
    html += '<label style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px">Anotações clínicas</label>';
    html += '<textarea id="pron-' + p.id + '" style="width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:9px;color:var(--text);font-size:13px;font-family:inherit;min-height:95px;resize:vertical;outline:none" placeholder="Anotações clínicas...">' + (p.observacoes||'') + '</textarea>';
    html += '<div style="text-align:right;margin-top:7px"><button class="btn btn-primary btn-sm" onclick="savePron(\'' + p.id + '\')">💾 Salvar</button></div>';
    html += '</div>';
  });
  openModal('📋 Prontuário — ' + c.name, html, true);
}

async function togglePago(pkgId, cid, back) {
  var p = allPackages.find(function(x){ return x.id===pkgId; });
  if (!p) return;
  await sb.from('packages').update({ pago: !p.pago }).eq('id', pkgId);
  await loadAll();
  showToast(!p.pago ? '💰 Marcado como pago!' : '⏳ Marcado como pendente!');
  if (back === 'perfil') openPerfil(cid);
  else openProntuario(cid);
}

async function savePron(pkgId) {
  var txt = (document.getElementById('pron-' + pkgId) || {}).value || '';
  await sb.from('packages').update({ observacoes: txt }).eq('id', pkgId);
  await loadAll();
  showToast('✅ Prontuário salvo!');
}

// ══════════════════════════════════════════════════════════
// SESSÕES / PACOTES
// ══════════════════════════════════════════════════════════
var spMonth = new Date();

function renderSessoes() {
  var MS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var y = spMonth.getFullYear(), m = spMonth.getMonth();
  // Show ALL clients with packages OR sessions this month
  var sesMes = allSessions.filter(function(s){
    var parts = s.date.split('-').map(Number);
    return parts[0]===y && (parts[1]-1)===m;
  });
  var cidsSet = {};
  sesMes.forEach(function(s){ cidsSet[s.client_id]=1; });
  allPackages.filter(function(p){ return !p.encerrado; }).forEach(function(p){ cidsSet[p.client_id]=1; });
  var cids = Object.keys(cidsSet).sort(function(a,b){ return clientName(a).localeCompare(clientName(b)); });

  var cardsHtml = '';
  cids.forEach(function(cid) {
    // Show ALL sessions for this client (not just current month)
    var list = allSessions.filter(function(s){ return s.client_id===cid; }).sort(function(a,b){
      return a.date.localeCompare(b.date) || (a.hora||'').localeCompare(b.hora||'');
    });
    var ativas = list.filter(function(s){ return s.status==='agendada'||s.status==='parcial'; });
    var feitas  = list.filter(function(s){ return s.status==='realizada'||s.status==='falta'; });
    var uid = cid.replace(/-/g,'').slice(0,8);
    var rTot = allSessions.filter(function(s){ return s.client_id===cid && s.status==='realizada'; }).length;
    var fTot = allSessions.filter(function(s){ return s.client_id===cid && s.status==='falta'; }).length;
    var pkgsC = allPackages.filter(function(p){ return p.client_id===cid; });

    // Build session table rows
    function makeRows(arr, dim) {
      return arr.map(function(s) {
        var pkg = s.package_id ? allPackages.find(function(p){ return p.id===s.package_id; }) : null;
        var ord = null, tot = 0;
        if (pkg) {
          var sorted = allSessions.filter(function(x){ return x.package_id===pkg.id; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
          ord = sorted.findIndex(function(x){ return x.id===s.id; }) + 1;
          tot = parseInt(pkg.total_sessoes)||0;
        }
        var pg = pkg ? !!pkg.pago : !!s.pago;
        var row = '<tr' + (dim?' style="opacity:.65"':'') + '>';
        row += '<td class="td-muted">' + (ord&&tot?ord+'/'+tot:'—') + '</td>';
        row += '<td><strong>' + fmtDate(s.date) + '</strong></td>';
        row += '<td>' + (s.hora||'—') + '</td>';
        row += '<td>' + badgeTipo(s.tipo) + '</td>';
        row += '<td class="td-muted">' + (pkg?clientName(pkg.client_id):'—') + '</td>';
        row += '<td><span style="cursor:pointer" title="Clique para alterar status" data-sid="' + s.id + '" onclick="quickStatus(this.dataset.sid)">' + badgeStatus(s.status) + '</span></td>';
        row += '<td><span class="badge ' + (pg?'badge-green':'badge-yellow') + '" style="cursor:pointer" onclick="togglePgto(\'' + s.id + '\')">' + (pg?'💰 Pago':'⏳ Pendente') + '</span></td>';
        row += '<td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="openSessaoModal(\'' + s.id + '\')">✏️</button> <button class="btn btn-danger btn-sm" onclick="deleteSessao(\'' + s.id + '\')">🗑️</button></td>';
        row += '</tr>';
        return row;
      }).join('');
    }

    var thead = '<thead><tr><th>Nº</th><th>DATA</th><th>HORA</th><th>CATEGORIA</th><th>PACOTE</th><th title="Clique para alterar">STATUS ✎</th><th>PGTO</th><th>AÇÕES</th></tr></thead>';

    var card = '<div class="card" style="margin-bottom:11px">';
    // Header
    card += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:' + (list.length?'11':'5') + 'px">';
    card += '<div class="avatar" style="width:39px;height:39px;font-size:14px;cursor:pointer" onclick="openPerfil(\'' + cid + '\')">' + initials(clientName(cid)) + '</div>';
    card += '<div style="flex:1"><div style="font-weight:700;font-size:14px">' + clientName(cid) + '</div>';
    card += '<div style="font-size:11px;color:var(--text2)">sessões:';
    if (rTot>0) card += ' <span style="color:var(--green)">' + rTot + ' realizadas</span>';
    if (fTot>0) card += ' · <span style="color:var(--red)">' + fTot + ' falta' + (fTot>1?'s':'') + '</span>';
    card += '</div></div>';
    card += '<button class="btn btn-secondary btn-sm" onclick="openProntuario(\'' + cid + '\')">📋 Prontuário</button>';
    card += '<button class="btn btn-ghost btn-sm" onclick="openPerfil(\'' + cid + '\')">Ver perfil →</button>';
    card += '</div>';

    // Active sessions table
    if (ativas.length) {
      card += '<div class="table-wrap"><table>' + thead + '<tbody>' + makeRows(ativas, false) + '</tbody></table></div>';
    } else {
      card += '<div style="font-size:12px;color:var(--text3);padding:2px 0 6px">Sem sessões agendadas neste mês</div>';
    }

    // Done sessions
    if (feitas.length) {
      var nF = feitas.filter(function(s){ return s.status==='falta'; }).length;
      card += '<button class="done-toggle" id="dt-btn-' + uid + '" onclick="toggleDoneSection(\'dt-' + uid + '\',\'dt-btn-' + uid + '\')">▶ Ver realizadas/faltas (' + feitas.length + (nF?' — '+nF+' falta'+(nF>1?'s':''):'') + ')</button>';
      card += '<div id="dt-' + uid + '" style="display:none"><div class="table-wrap"><table>' + thead + '<tbody>' + makeRows(feitas, true) + '</tbody></table></div></div>';
    }

    // Package badges
    if (pkgsC.length) {
      card += '<div style="margin-top:9px;padding-top:7px;border-top:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span style="font-size:11px;color:var(--text3)">Pacotes:</span>';
      pkgsC.forEach(function(p) {
        var r = allSessions.filter(function(s){ return s.package_id===p.id && s.status==='realizada'; }).length;
        var t = parseInt(p.total_sessoes)||0;
        var e = TIPOS[p.tipo] ? TIPOS[p.tipo].emoji : '📦';
        card += '<span class="badge ' + (p.pago?'badge-green':'badge-yellow') + '" style="cursor:pointer" onclick="openPacoteModal(\'' + p.id + '\')" title="' + (TIPOS[p.tipo]?TIPOS[p.tipo].label:p.tipo) + '">' + e + ' ' + r + '/' + t + ' ' + (p.pago?'💰':'⏳') + '</span>';
      });
      card += '</div>';
    }
    card += '</div>';
    cardsHtml += card;
  });

  // All packages section
  var pkgsHtml = '';
  allPackages.forEach(function(p) {
    var r   = allSessions.filter(function(s){ return s.package_id===p.id && s.status==='realizada'; }).length;
    var t   = parseInt(p.total_sessoes)||0;
    var pct = t>0?Math.round((r/t)*100):0;
    var bc  = pct>=100?'pg-red':pct>=70?'pg-yellow':'pg-green';
    pkgsHtml += '<div class="card" style="margin-bottom:9px">';
    pkgsHtml += '<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">';
    pkgsHtml += '<div class="avatar" style="width:34px;height:34px;font-size:12px">' + initials(clientName(p.client_id)) + '</div>';
    pkgsHtml += '<div style="flex:1"><div style="font-weight:600">' + clientName(p.client_id) + '</div>';
    pkgsHtml += '<div style="font-size:11px;color:var(--text3)">' + badgeTipo(p.tipo) + ' — ' + pluralSessao(t) + ' — ' + fmtMoney(p.valor_total) + '</div></div>';
    pkgsHtml += '<span class="badge ' + (p.encerrado?'badge-gray':'badge-green') + '">' + (p.encerrado?'Encerrado':'Ativo') + '</span>';
    pkgsHtml += '<button class="btn btn-ghost btn-sm" onclick="openPacoteModal(\'' + p.id + '\')">✏️</button>';
    pkgsHtml += '</div>';
    pkgsHtml += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px"><span>' + r + ' realizadas de ' + t + '</span><span>' + pct + '%</span></div>';
    pkgsHtml += '<div class="progress-bar"><div class="progress-fill ' + bc + '" style="width:' + Math.min(pct,100) + '%"></div></div>';
    pkgsHtml += '</div>';
  });

  var html = '';
  html += '<div class="topbar"><button class="hamburger" onclick="toggleSidebar()">☰</button><h1 class="page-title">Sessões/Pacotes</h1>' + themeBtn() + '<button class="btn btn-secondary" onclick="openPacoteModal()">+ Pacote</button><button class="btn btn-primary" onclick="openSessaoModal()">+ Sessão</button></div>';
  html += '<div style="display:flex;gap:7px;align-items:center;margin-bottom:15px">';
  html += '<button class="cal-nav-btn" onclick="spMoveMes(-1)">‹</button>';
  html += '<span style="font-weight:600;min-width:88px;text-align:center">' + MS[m] + ' ' + y + '</span>';
  html += '<button class="cal-nav-btn" onclick="spMoveMes(1)">›</button>';
  html += '<button class="btn btn-ghost btn-sm" onclick="spReset()">Hoje</button>';
  html += '</div>';
  html += (cardsHtml || '<div class="empty"><div class="empty-icon">📋</div><p>Sem clientes com sessões ou pacotes ativos neste mês</p></div>');
  setMain(html);
}

function spMoveMes(d) { spMonth.setMonth(spMonth.getMonth()+d); renderSessoes(); }
function spReset() { spMonth = new Date(); renderSessoes(); }

function toggleDoneSection(sectionId, btnId) {
  var el  = document.getElementById(sectionId);
  var btn = document.getElementById(btnId);
  if (!el || !btn) return;
  var open = el.style.display !== 'none';
  el.style.display  = open ? 'none' : 'block';
  btn.textContent   = (open ? '▶' : '▼') + btn.textContent.slice(1);
}

function quickStatus(sid) {
  var s = allSessions.find(function(x){ return x.id===sid; });
  if (!s) return;
  var cur = s.status;
  var html = '<p style="color:var(--text2);font-size:13px;margin-bottom:16px">Selecione o novo status para esta sessão:</p>';
  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  html += '<button class="btn" style="justify-content:flex-start;padding:12px 16px;background:rgba(96,165,250,.12);color:var(--blue);border:1px solid rgba(96,165,250,.25)" data-sid="'+sid+'" data-st="agendada" onclick="setStatus(this.dataset.sid,this.dataset.st)">📅 Agendada</button>';
  html += '<button class="btn" style="justify-content:flex-start;padding:12px 16px;background:rgba(52,217,138,.12);color:var(--green);border:1px solid rgba(52,217,138,.25)" data-sid="'+sid+'" data-st="realizada" onclick="setStatus(this.dataset.sid,this.dataset.st)">✅ Realizada</button>';
  html += '<button class="btn" style="justify-content:flex-start;padding:12px 16px;background:rgba(240,96,96,.12);color:var(--red);border:1px solid rgba(240,96,96,.25)" data-sid="'+sid+'" data-st="falta" onclick="setStatus(this.dataset.sid,this.dataset.st)">❌ Falta</button>';
  html += '<button class="btn" style="justify-content:flex-start;padding:12px 16px;background:rgba(251,146,60,.12);color:var(--orange);border:1px solid rgba(251,146,60,.25)" data-sid="'+sid+'" data-st="parcial" onclick="setStatus(this.dataset.sid,this.dataset.st)">⚠️ Parcial</button>';
  html += '</div>';
  html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);text-align:right"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button></div>';
  openModal('Alterar Status da Sessão', html);
}

async function setStatus(sid, status) {
  await sb.from('sessions').update({ status: status }).eq('id', sid);
  await loadAll(); closeModal(); renderSessoes();
  showToast('✅ Status atualizado: ' + status);
}

function togglePgto(sid) {
  var s = allSessions.find(function(x){ return x.id===sid; });
  if (!s) return;
  var pkg = s.package_id ? allPackages.find(function(x){ return x.id===s.package_id; }) : null;
  var sessPago = !!s.pago;
  var pkgPago  = pkg ? !!pkg.pago : false;

  var html = '<p style="color:var(--text2);font-size:13px;margin-bottom:16px">Como deseja registrar o pagamento?</p>';
  html += '<div style="display:flex;flex-direction:column;gap:10px">';

  // Option 1: this session only
  html += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px">';
  html += '<div style="font-weight:600;margin-bottom:4px">💳 Esta sessão apenas</div>';
  html += '<div style="font-size:12px;color:var(--text2);margin-bottom:10px">Marca somente esta sessão como paga individualmente</div>';
  if (sessPago) {
    html += '<button class="btn btn-ghost btn-sm" data-sid="'+sid+'" onclick="pagarSessao(this.dataset.sid,false)">↩️ Marcar como pendente</button>';
  } else {
    html += '<button class="btn btn-primary btn-sm" data-sid="'+sid+'" onclick="pagarSessao(this.dataset.sid,true)">✅ Marcar esta sessão como paga</button>';
  }
  html += '</div>';

  // Option 2: entire package (only if has package)
  if (pkg) {
    html += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px">';
    html += '<div style="font-weight:600;margin-bottom:4px">📦 Pacote inteiro — ' + fmtMoney(pkg.valor_total) + '</div>';
    html += '<div style="font-size:12px;color:var(--text2);margin-bottom:10px">Marca o pacote completo como pago de uma vez</div>';
    if (pkgPago) {
      html += '<span class="badge badge-green" style="margin-bottom:8px;display:inline-flex">💰 Pacote já está pago</span><br>';
      html += '<button class="btn btn-ghost btn-sm" data-pid="'+pkg.id+'" onclick="pagarPacote(this.dataset.pid,false)">↩️ Marcar como pendente</button>';
    } else {
      html += '<button class="btn btn-primary btn-sm" data-pid="'+pkg.id+'" onclick="pagarPacote(this.dataset.pid,true)">💰 Marcar pacote completo como pago</button>';
    }
    html += '</div>';
  }

  html += '</div>';
  html += '<div style="margin-top:14px;text-align:right"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button></div>';
  openModal('Registrar Pagamento', html);
}

async function pagarSessao(sid, pago) {
  await sb.from('sessions').update({ pago: pago }).eq('id', sid);
  await loadAll(); closeModal(); renderSessoes();
  showToast(pago ? '💳 Sessão marcada como paga!' : '⏳ Sessão marcada como pendente!');
}

async function pagarPacote(pkgId, pago) {
  await sb.from('packages').update({ pago: pago }).eq('id', pkgId);
  await loadAll(); closeModal(); renderSessoes();
  showToast(pago ? '💰 Pacote marcado como pago!' : '⏳ Pacote marcado como pendente!');
}

// ══════════════════════════════════════════════════════════
// MODAL SESSÃO
// ══════════════════════════════════════════════════════════
function openSessaoModal(id, dateStr, preCid, prePkgId) {
  var s = id ? (allSessions.find(function(x){ return x.id===id; }) || {}) : {};
  // Auto-fill valor from package
  var autoValor = s.valor || '';
  if (!id && prePkgId) {
    var prePkg = allPackages.find(function(p){ return p.id===prePkgId; });
    if (prePkg && prePkg.total_sessoes) {
      autoValor = (parseFloat(prePkg.valor_total)||0) / (parseInt(prePkg.total_sessoes)||1);
      autoValor = autoValor.toFixed(2);
    }
  }
  var cOpts = allClients.map(function(c){
    return '<option value="' + c.id + '"' + ((s.client_id||preCid)===c.id?' selected':'') + '>' + c.name + '</option>';
  }).join('');
  var pOpts = '<option value="">— Sem pacote —</option>' + allPackages.map(function(p){
    return '<option value="' + p.id + '"' + ((s.package_id||prePkgId)===p.id?' selected':'') + '>' + clientName(p.client_id) + ' – ' + (TIPOS[p.tipo]?TIPOS[p.tipo].label:p.tipo) + '</option>';
  }).join('');

  var html = '';
  html += '<div class="form-row"><div class="form-group"><label>Cliente *</label><select id="s-client">' + cOpts + '</select></div><div class="form-group"><label>Tipo</label><select id="s-tipo">' + tipoOpts(s.tipo||'psicoterapia') + '</select></div></div>';
  html += '<div class="form-row"><div class="form-group"><label>Data *</label><input id="s-date" type="date" value="' + (s.date||dateStr||'') + '"></div><div class="form-group"><label>Horário</label><input id="s-hora" type="time" value="' + (s.hora||'') + '"></div></div>';
  html += '<div class="form-row"><div class="form-group"><label>Status</label><select id="s-status"><option value="agendada"' + (s.status==='agendada'?' selected':'') + '>📅 Agendada</option><option value="realizada"' + (s.status==='realizada'?' selected':'') + '>✅ Realizada</option><option value="falta"' + (s.status==='falta'?' selected':'') + '>❌ Falta</option><option value="parcial"' + (s.status==='parcial'?' selected':'') + '>⚠️ Parcial</option></select></div><div class="form-group"><label>Valor (R$)</label><input id="s-valor" type="number" step="0.01" value="' + autoValor + '"></div></div>';
  html += '<div class="form-group"><label>Pacote</label><select id="s-pkg">' + pOpts + '</select></div>';
  html += '<div class="form-group"><label>Anotações</label><textarea id="s-obs">' + (s.observacoes||'') + '</textarea></div>';
  html += '<div class="form-actions">';
  if (id) html += '<button class="btn btn-danger" onclick="deleteSessao(\'' + id + '\')">Excluir</button>';
  html += '<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>';
  html += '<button class="btn btn-primary" onclick="saveSessao(\'' + (id||'') + '\')">Salvar</button>';
  html += '</div>';
  openModal(id ? 'Editar Sessão' : 'Nova Sessão', html);
}

async function saveSessao(id) {
  var data = {
    client_id:  document.getElementById('s-client').value,
    tipo:       document.getElementById('s-tipo').value,
    date:       document.getElementById('s-date').value,
    hora:       document.getElementById('s-hora').value || null,
    status:     document.getElementById('s-status').value,
    valor:      parseFloat(document.getElementById('s-valor').value) || 0,
    package_id: document.getElementById('s-pkg').value || null,
    observacoes:document.getElementById('s-obs').value.trim(),
    user_id:    currentUser.id
  };
  if (!data.date) { alert('Data é obrigatória'); return; }
  if (id) { await sb.from('sessions').update(data).eq('id', id); }
  else    { await sb.from('sessions').insert(data); }
  await loadAll(); closeModal();
  // Refresh current page
  var activePage = document.querySelector('.nav-btn.active');
  var page = activePage ? activePage.dataset.page : 'agenda';
  if (page === 'sessoes') renderSessoes();
  else if (page === 'financeiro') renderFinanceiro();
  else renderAgenda();
  showToast('✅ Sessão salva! Aparece na Agenda automaticamente.');
}

async function deleteSessao(id) {
  if (!confirm('Excluir sessão?')) return;
  await sb.from('sessions').delete().eq('id', id);
  await loadAll(); closeModal(); renderSessoes(); showToast('🗑️ Sessão excluída');
}

// MODAL PACOTE (com geração automática de sessões)
// ══════════════════════════════════════════════════════════
function openPacoteModal(id, preCid) {
  var p = id ? (allPackages.find(function(x){ return x.id===id; }) || {}) : {};
  var cOpts = allClients.map(function(c){
    return '<option value="' + c.id + '"' + ((p.client_id||preCid)===c.id?' selected':'') + '>' + c.name + '</option>';
  }).join('');

  var html = '';
  html += '<div class="form-group"><label>Cliente *</label><select id="p-client">' + cOpts + '</select></div>';
  html += '<div class="form-row"><div class="form-group"><label>Tipo</label><select id="p-tipo">' + tipoOpts(p.tipo||'psicoterapia') + '</select></div><div class="form-group"><label>Total de Sessões</label><input id="p-total" type="number" min="1" value="' + (p.total_sessoes||10) + '"></div></div>';
  html += '<div class="form-row"><div class="form-group"><label>Valor Total (R$)</label><input id="p-valor" type="number" step="0.01" value="' + (p.valor_total||'') + '"></div><div class="form-group"><label>Pagamento</label><select id="p-pgto"><option value="pix"' + (p.pagamento==='pix'?' selected':'') + '>Pix</option><option value="dinheiro"' + (p.pagamento==='dinheiro'?' selected':'') + '>Dinheiro</option><option value="cartao"' + (p.pagamento==='cartao'?' selected':'') + '>Cartão</option></select></div></div>';
  html += '<div class="form-row"><div class="form-group"><label>Status</label><select id="p-enc"><option value="false"' + (!p.encerrado?' selected':'') + '>Ativo</option><option value="true"' + (p.encerrado?' selected':'') + '>Encerrado</option></select></div><div class="form-group"><label style="display:flex;align-items:center;gap:7px;text-transform:none;font-size:13px;font-weight:500;margin-top:20px"><input type="checkbox" id="p-pago" style="width:auto" ' + (p.pago?'checked':'') + '> Pagamento recebido</label></div></div>';

  // Auto-generate sessions (only for new packages)
  if (!id) {
    html += '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0">';
    html += '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px">📅 Gerar sessões automaticamente</div>';
    html += '<div class="form-row"><div class="form-group"><label>Data da 1ª sessão</label><input id="p-start" type="date"></div><div class="form-group"><label>Horário</label><input id="p-hora" type="time" value="09:00"></div></div>';
    html += '<div class="form-group"><label>Repetição</label><select id="p-repeat"><option value="none">Não repetir (só 1ª sessão)</option><option value="7">Semanalmente (toda semana)</option><option value="14">Quinzenalmente (a cada 2 sem)</option><option value="30">Mensalmente</option></select></div>';
    html += '<div style="font-size:11px;color:var(--text3);margin-top:-8px;margin-bottom:12px">💡 As sessões serão criadas automaticamente no pacote</div>';
  }

  html += '<div class="form-group"><label>Observações (Prontuário)</label><textarea id="p-obs">' + (p.observacoes||'') + '</textarea></div>';
  html += '<div class="form-actions">';
  if (id) html += '<button class="btn btn-danger" onclick="deletePacote(\'' + id + '\')">Excluir</button>';
  html += '<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>';
  html += '<button class="btn btn-primary" onclick="savePacote(\'' + (id||'') + '\')">Salvar</button>';
  html += '</div>';
  openModal(id ? 'Editar Pacote' : 'Novo Pacote', html);
}

async function savePacote(id) {
  var data = {
    client_id:    document.getElementById('p-client').value,
    tipo:         document.getElementById('p-tipo').value,
    total_sessoes:parseInt(document.getElementById('p-total').value) || 10,
    valor_total:  parseFloat(document.getElementById('p-valor').value) || 0,
    pagamento:    document.getElementById('p-pgto').value,
    encerrado:    document.getElementById('p-enc').value === 'true',
    pago:         (document.getElementById('p-pago') || {}).checked || false,
    data_pagamento: (document.getElementById('p-pago')||{}).checked ? new Date().toISOString().slice(0,10) : null,
    observacoes:  document.getElementById('p-obs').value.trim(),
    user_id:      currentUser.id
  };

  var pkgId;
  if (id) {
    await sb.from('packages').update(data).eq('id', id);
    pkgId = id;
  } else {
    var res = await sb.from('packages').insert(data).select().single();
    pkgId = res.data ? res.data.id : null;

    // Auto-generate sessions
    if (pkgId) {
      var startDate = (document.getElementById('p-start') || {}).value;
      var hora      = (document.getElementById('p-hora')  || {}).value || null;
      var repeat    = (document.getElementById('p-repeat')|| {}).value || 'none';
      var total     = data.total_sessoes;

      if (startDate && repeat !== 'none') {
        var sessions = [];
        var current  = new Date(startDate + 'T12:00:00');
        var interval = parseInt(repeat);
        var valorPorSessao = total > 0 ? (parseFloat(data.valor_total)||0) / total : 0;
        for (var i = 0; i < total; i++) {
          sessions.push({
            client_id:  data.client_id,
            package_id: pkgId,
            tipo:       data.tipo,
            date:       current.toISOString().slice(0,10),
            hora:       hora,
            status:     'agendada',
            valor:      parseFloat(valorPorSessao.toFixed(2)),
            user_id:    currentUser.id
          });
          current.setDate(current.getDate() + interval);
        }
        if (sessions.length) {
          await sb.from('sessions').insert(sessions);
          showToast('✅ Pacote criado com ' + sessions.length + ' sessões geradas!');
        }
      } else if (startDate) {
        // Just 1 session
        await sb.from('sessions').insert({
          client_id:  data.client_id,
          package_id: pkgId,
          tipo:       data.tipo,
          date:       startDate,
          hora:       hora,
          status:     'agendada',
          valor:      parseFloat(data.valor_total) || 0,
          user_id:    currentUser.id
        });
        showToast('✅ Pacote criado com 1 sessão!');
      } else {
        showToast('✅ Pacote criado!');
      }
    }
  }

  await loadAll(); closeModal(); renderSessoes();
  if (id) showToast('✅ Pacote salvo!');
}

async function deletePacote(id) {
  if (!confirm('Excluir pacote e todas as sessões?')) return;
  await sb.from('sessions').delete().eq('package_id', id);
  await sb.from('packages').delete().eq('id', id);
  await loadAll(); closeModal(); renderSessoes(); showToast('🗑️ Pacote excluído');
}

// ══════════════════════════════════════════════════════════
// AGENDA
// ══════════════════════════════════════════════════════════
function renderAgenda() {
  var html = '<div class="topbar"><button class="hamburger" onclick="toggleSidebar()">☰</button><h1 class="page-title">Agenda</h1>' + themeBtn() + '<button class="btn btn-primary" onclick="openSessaoModal()">+ Nova Sessão</button></div>';
  html += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden">';
  html += '<div class="cal-toolbar">';
  html += '<div style="display:flex;align-items:center;gap:7px"><button class="cal-nav-btn" onclick="calMov(-1)">‹</button>';
  html += '<span class="cal-title" id="cal-title">' + getCalTitle() + '</span>';
  html += '<button class="cal-nav-btn" onclick="calMov(1)">›</button>';
  html += '<button class="cal-nav-btn" style="font-size:12px;font-weight:600" onclick="calToday()">Hoje</button></div>';
  html += '<div class="cal-view-btns">';
  html += '<button class="cal-view-btn' + (calView==='month'?' active':'') + '" onclick="setCalView(\'month\')">Mês</button>';
  html += '<button class="cal-view-btn' + (calView==='week'?' active':'') + '" onclick="setCalView(\'week\')">Semana</button>';
  html += '<button class="cal-view-btn' + (calView==='list'?' active':'') + '" onclick="setCalView(\'list\')">Lista</button>';
  html += '</div></div>';
  html += '<div id="cal-body">' + buildCal() + '</div></div>';
  setMain(html);
}

function getCalTitle() {
  var MS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  if (calView === 'week') {
    var d = new Date(calDate), day = d.getDay();
    var mon = new Date(d); mon.setDate(d.getDate() - (day===0?6:day-1));
    var sun = new Date(mon); sun.setDate(mon.getDate()+6);
    return mon.getDate() + ' – ' + sun.getDate() + ' ' + MS[sun.getMonth()] + ' ' + sun.getFullYear();
  }
  return MS[calDate.getMonth()] + ' de ' + calDate.getFullYear();
}

function calMov(d) {
  if (calView==='week') calDate.setDate(calDate.getDate()+(d*7));
  else calDate.setMonth(calDate.getMonth()+d);
  var t = document.getElementById('cal-title');
  if (t) t.textContent = getCalTitle();
  document.getElementById('cal-body').innerHTML = buildCal();
}

function calToday() {
  calDate = new Date();
  var t = document.getElementById('cal-title');
  if (t) t.textContent = getCalTitle();
  document.getElementById('cal-body').innerHTML = buildCal();
}

function setCalView(v) { calView = v; renderAgenda(); }

function buildCal() {
  if (calView==='week') return buildWeek();
  if (calView==='list') return buildList();
  return buildMonth();
}

function buildMonth() {
  var y = calDate.getFullYear(), m = calDate.getMonth();
  var first = new Date(y,m,1).getDay();
  var days  = new Date(y,m+1,0).getDate();
  var today = new Date().toISOString().slice(0,10);
  var html  = '<div class="month-grid">';
  ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(function(d){ html += '<div class="month-header">' + d + '</div>'; });
  var pad = first===0?6:first-1;
  for (var i=0; i<pad; i++) html += '<div class="month-day other"></div>';
  for (var d=1; d<=days; d++) {
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var ses = allSessions.filter(function(s){ return s.date===ds; }).sort(function(a,b){ return (a.hora||'').localeCompare(b.hora||''); });
    var isT = ds===today;
    html += '<div class="month-day' + (isT?' today':'') + '" onclick="openSessaoModal(null,\'' + ds + '\')">';
    html += '<div class="day-num">' + d + '</div>';
    ses.slice(0,3).forEach(function(s) {
      var pkg = s.package_id ? allPackages.find(function(p){ return p.id===s.package_id; }) : null;
      var n = null, tot = 0;
      if (pkg) {
        var sorted = allSessions.filter(function(x){ return x.package_id===pkg.id; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
        n = sorted.findIndex(function(x){ return x.id===s.id; })+1;
        tot = parseInt(pkg.total_sessoes)||0;
      }
      var chip = TIPOS[s.tipo] ? TIPOS[s.tipo].chip : 'chip-ps';
      var done = s.status==='realizada'?' chip-done':'';
      var fa   = s.status==='falta'?' chip-fa':'';
      var lbl  = (s.hora?s.hora.slice(0,5)+' ':'') + clientName(s.client_id) + (n&&tot?' '+n+'/'+tot:'');
      html += '<span class="cal-chip ' + chip + done + fa + '" onclick="event.stopPropagation();openSessaoModal(\'' + s.id + '\')">' + lbl + '</span>';
    });
    if (ses.length>3) html += '<span style="font-size:10px;color:var(--text3);padding:1px 5px">+' + (ses.length-3) + '</span>';
    html += '</div>';
  }
  return html + '</div>';
}

function buildWeek() {
  var d = new Date(calDate), day = d.getDay();
  var mon = new Date(d); mon.setDate(d.getDate()-(day===0?6:day-1));
  var dias = [];
  for (var i=0; i<7; i++) { var dd = new Date(mon); dd.setDate(mon.getDate()+i); dias.push(dd); }
  var today = new Date().toISOString().slice(0,10);
  var horas  = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];
  var nms    = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  var html   = '<div style="display:flex"><div style="width:46px;flex-shrink:0;border-right:1px solid var(--border)"><div style="height:50px;border-bottom:1px solid var(--border)"></div>';
  horas.forEach(function(hr){ html += '<div style="height:52px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 6px 0;font-size:10px;color:var(--text3)">' + hr + '</div>'; });
  html += '</div><div style="flex:1;display:grid;grid-template-columns:repeat(7,1fr)">';
  dias.forEach(function(dt,i){
    var ds = dt.toISOString().slice(0,10);
    html += '<div style="text-align:center;padding:10px 3px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)' + (ds===today?';background:rgba(52,217,138,.05)':'') + '">';
    html += '<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase">' + nms[i] + '</div>';
    html += '<div style="font-size:17px;font-weight:300;color:var(--text);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin:3px auto 0' + (ds===today?';background:var(--green);color:#0a1a12':'') + '">' + dt.getDate() + '</div>';
    html += '</div>';
  });
  horas.forEach(function(hr){
    dias.forEach(function(dt){
      var ds = dt.toISOString().slice(0,10);
      var ses = allSessions.filter(function(s){ return s.date===ds && (s.hora||'').startsWith(hr.slice(0,2)); });
      html += '<div style="height:52px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px;cursor:pointer" onclick="openSessaoModal(null,\'' + ds + '\')">';
      ses.forEach(function(s){
        var chip = TIPOS[s.tipo] ? TIPOS[s.tipo].chip : 'chip-ps';
        html += '<span class="cal-chip ' + chip + '" style="display:block" onclick="event.stopPropagation();openSessaoModal(\'' + s.id + '\')">' + clientName(s.client_id) + '</span>';
      });
      html += '</div>';
    });
  });
  return html + '</div></div>';
}

function buildList() {
  var y = calDate.getFullYear(), m = calDate.getMonth();
  var ses = allSessions.filter(function(s){
    var parts = s.date.split('-').map(Number);
    return parts[0]===y && (parts[1]-1)===m;
  }).sort(function(a,b){ return a.date.localeCompare(b.date)||(a.hora||'').localeCompare(b.hora||''); });
  if (!ses.length) return '<div class="empty"><div class="empty-icon">📅</div><p>Sem sessões neste mês</p></div>';
  var html = '<div class="table-wrap"><table><thead><tr><th>DATA</th><th>HORA</th><th>CLIENTE</th><th>TIPO</th><th>STATUS</th><th></th></tr></thead><tbody>';
  ses.forEach(function(s){
    html += '<tr><td>' + fmtDate(s.date) + '</td><td>' + (s.hora||'—') + '</td><td>' + clientName(s.client_id) + '</td><td>' + badgeTipo(s.tipo) + '</td><td>' + badgeStatus(s.status) + '</td>';
    html += '<td><button class="btn btn-ghost btn-sm" onclick="openSessaoModal(\'' + s.id + '\')">✏️</button></td></tr>';
  });
  return html + '</tbody></table></div>';
}

function renderAnexos() {
  var grupos = {};
  allDocs.forEach(function(d){ var k = d.client_id||'_'; if (!grupos[k]) grupos[k]=[]; grupos[k].push(d); });

    html += '<div class="card" style="margin-bottom:11px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:11px">';
    html += '<div class="avatar" style="width:32px;height:32px;font-size:12px">' + initials(cid==='_'?'?':clientName(cid)) + '</div>';
    html += '<div style="font-weight:600">' + (cid==='_'?'Sem cliente':clientName(cid)) + '</div>';
    html += '<span style="font-size:11px;color:var(--text3)">' + docs.length + ' arquivo(s)</span></div>';
    docs.forEach(function(d){
      html += '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">';
      html += '<span style="font-size:20px">' + fileIcon(d.filename) + '</span>';
      html += '<div style="flex:1"><div style="font-size:13px;font-weight:500">' + d.filename + '</div>';
      html += '<div style="font-size:11px;color:var(--text3)">' + (d.description||'') + (d.size_bytes?' · '+fmtSize(d.size_bytes):'') + '</div></div>';
      html += '<a href="' + d.url + '" download="' + d.filename + '" class="btn btn-ghost btn-sm">⬇️</a>';
      html += '<button class="btn btn-danger btn-sm" onclick="deleteAnexo(\'' + d.id + '\',\'' + (d.storage_path||'') + '\')">🗑️</button>';
      html += '</div>';
    });
    html += '</div>';

  if (!allDocs.length) html += '<div class="empty"><div class="empty-icon">📁</div><p>Nenhum anexo</p></div>';

function openAnexoModal() {
  var cOpts = '<option value="">— Sem cliente —</option>' + allClients.map(function(c){
    return '<option value="' + c.id + '">' + c.name + '</option>';
  }).join('');
  var html = '<div class="form-group"><label>Cliente</label><select id="ax-client">' + cOpts + '</select></div>';
  html += '<div class="form-group"><label>Descrição</label><input id="ax-desc" placeholder="Laudo, contrato..."></div>';
  html += '<div class="form-group"><label>Arquivo</label>';
  html += '<div style="border:2px dashed var(--border2);border-radius:14px;padding:24px;text-align:center;cursor:pointer" onclick="document.getElementById(\'ax-file\').click()">';
  html += '<div style="font-size:26px;margin-bottom:5px">📎</div>';
  html += '<div style="color:var(--text2);font-size:13px">Clique para selecionar</div>';
  html += '<div style="color:var(--text3);font-size:11px;margin-top:3px">PDF, Word, Excel, Imagens — máx. 10MB</div>';
  html += '<input type="file" id="ax-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.txt" style="display:none" onchange="document.getElementById(\'ax-lbl\').textContent=\'✅ \'+(this.files[0]&&this.files[0].name||\'\')">';
  html += '</div><div id="ax-lbl" style="font-size:12px;color:var(--green);margin-top:5px"></div></div>';
  html += '<div class="form-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveAnexo()">Enviar</button></div>';

}

async function saveAnexo() {
  if (sending) return;
  var file = (document.getElementById('ax-file').files || [])[0];
  if (!file) { alert('Selecione um arquivo'); return; }
  if (file.size > 10*1024*1024) { alert('Máximo 10MB'); return; }
  var cid  = document.getElementById('ax-client').value || null;
  var desc = document.getElementById('ax-desc').value.trim();
  sending  = true; closeModal(); showToast('⏳ Enviando...', 'ok', 8000);
  try {
    var ext  = file.name.split('.').pop().toLowerCase();
    var mime = MIME_MAP[ext] || file.type || 'application/octet-stream';
    var path = currentUser.id + '/' + Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    var upRes = await sb.storage.from('documents').upload(path, file, { contentType: mime });
    if (upRes.error) throw upRes.error;
    var urlRes = sb.storage.from('documents').getPublicUrl(path);
    var publicUrl = urlRes.data.publicUrl;
    await sb.from('documents').insert({ client_id:cid, filename:file.name, description:desc, url:publicUrl, storage_path:path, size_bytes:file.size, user_id:currentUser.id });
    showToast('✅ Arquivo enviado!'); await loadAll(); renderAnexos();
  } catch(e) { showToast('❌ Erro: ' + e.message, 'er'); }
  finally { sending = false; }
}

async function deleteAnexo(id, path) {
  if (!confirm('Excluir anexo?')) return;
  if (path) await sb.storage.from('documents').remove([path]);
  await sb.from('documents').delete().eq('id', id);
  await loadAll(); renderAnexos();
}

function renderNotas() {
  setMain('<div class="topbar"><button class="hamburger" onclick="toggleSidebar()">☰</button><h1 class="page-title">Notas 📝</h1>' + themeBtn() + '<button class="btn btn-primary" onclick="criarNota()">+ Nova Nota</button></div><div id="notas-list">Carregando...</div>');
  loadNotas();
}

async function loadNotas() {
  var cached = localStorage.getItem('ls_notes');
  if (cached) { try { noteData = JSON.parse(cached); buildNotasList(); } catch(e){} }
  var res = await sb.from('notes').select('*').eq('user_id', currentUser.id).order('updated_at', { ascending: false });
  noteData = {};
  (res.data||[]).forEach(function(n){ noteData[n.id] = n; });
  localStorage.setItem('ls_notes', JSON.stringify(noteData));
  buildNotasList();
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildNotasList() {
  var el = document.getElementById('notas-list');
  if (!el) return;
  var notas = Object.values(noteData);
  if (!notas.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><p>Nenhuma nota ainda</p></div>'; return; }
  var html = notas.map(function(n) {
    return '<div class="note-card" id="nc-' + n.id + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">' +
      '<input style="background:none;border:none;font-size:14px;font-weight:600;color:var(--text);padding:0;flex:1;outline:none" value="' + escHtml(n.title) + '" placeholder="Título" onchange="updateNota(\'' + n.id + '\',\'title\',this.value)">' +
      '<button class="btn btn-danger btn-sm" onclick="deleteNota(\'' + n.id + '\')">🗑️</button></div>' +
      '<textarea style="width:100%;background:none;border:none;color:var(--text2);font-size:13px;resize:none;min-height:65px;font-family:inherit;outline:none" placeholder="Escreva aqui..." oninput="onNotaInput(\'' + n.id + '\',\'conteudo\',this.value)">' + escHtml(n.conteudo) + '</textarea>' +
      '<div style="font-size:10px;color:var(--text3);margin-top:4px" id="ns-' + n.id + '">' + (n.updated_at?fmtDate(n.updated_at.slice(0,10)):'') + '</div>' +
      '</div>';
  }).join('');
  el.innerHTML = html;
}

function onNotaInput(id, field, val) {
  clearTimeout(noteTimers[id]);
  var c = document.getElementById('nc-'+id), s = document.getElementById('ns-'+id);
  if (c) c.className = 'note-card note-saving';
  if (s) s.textContent = '✏️ Digitando...';
  noteTimers[id] = setTimeout(function(){ updateNota(id, field, val); }, 2000);
}

async function updateNota(id, field, val) {
  var s = document.getElementById('ns-'+id), c = document.getElementById('nc-'+id);
  await sb.from('notes').update({ [field]: val, updated_at: new Date().toISOString() }).eq('id', id);
  if (noteData[id]) { noteData[id][field] = val; localStorage.setItem('ls_notes', JSON.stringify(noteData)); }
  if (c) c.className = 'note-card note-saved';
  if (s) s.textContent = '✅ Salvo!';
}

async function criarNota() {
  var res = await sb.from('notes').insert({ title: 'Nova Nota', conteudo: '', user_id: currentUser.id }).select().single();
  if (res.data) { noteData[res.data.id] = res.data; buildNotasList(); }
}

async function deleteNota(id) {
  if (!confirm('Excluir nota?')) return;
  await sb.from('notes').delete().eq('id', id);
  delete noteData[id]; localStorage.setItem('ls_notes', JSON.stringify(noteData)); buildNotasList();
}
